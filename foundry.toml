[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# Fork tests need a live RPC and are run through the `fork` profile (see README).
no_match_path = "test/fork/*"

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

[profile.fork]
no_match_path = "test/invariants/*"
match_path = "test/fork/*"
fuzz = { runs = 16 }
